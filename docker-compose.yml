services:
  backend:
    build: ./backend
    container_name: url-checker-backend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: url-checker-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
